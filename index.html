<style>
:root{
  --bg:#f3f2f2; --surface:#eae9e9; --paper:#fbfaf9; --text:#201f1d;
  --n600:#7d7979; --n500:#9b9797; --n400:#bab6b6; --n300:#d7d3d3; --n700:#605d5d; --n800:#444141;
  --accent:#b68235; --accent-400:#e1ad66; --accent-700:#7d5411; --danger:#8a3d2c;
  --divider:rgba(32,31,29,.16); --hair:rgba(32,31,29,.1);
  --serif:"Noto Serif TC","Lora",serif; --display:"Cormorant Garamond","Noto Serif TC",serif; --num:"Lora",serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text); font-family:var(--serif); font-size:16px; line-height:1.6;
  -webkit-text-size-adjust:100%;
}
.app{max-width:640px;margin:0 auto;padding:0 22px calc(96px + env(safe-area-inset-bottom));}
h2{font-family:var(--display);font-weight:400;margin:0}
input{font:inherit;color:inherit}
button{font:inherit}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::selection{background:rgba(182,130,53,.3)}

.status{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;gap:7px;
  padding:12px 0 10px;font-size:12.5px;color:var(--n600);border-bottom:1px solid var(--hair)}
.status svg{flex:none}
.kicker{font-family:"Lora",serif;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent-700)}
.rule{height:1px;background:var(--divider)}
.sec{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sec-t{font-family:var(--display);font-size:17px;letter-spacing:.14em;color:var(--n800)}
.sec .rule{flex:1}
.sec-n{font-size:12.5px;color:var(--n600);font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:24px;padding-top:14px}
.col{display:flex;flex-direction:column;gap:12px}
.muted{font-size:13px;line-height:1.8;color:var(--n600)}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;letter-spacing:.1em;color:var(--n700)}
.input{width:100%;background:transparent;border:1px solid var(--divider);border-radius:4px;
  padding:0 14px;min-height:52px;font-family:var(--serif);font-size:17px}
.input:hover{border-color:var(--accent-400)}
.input:focus-visible{border-color:var(--accent)}
.bare{border:none;border-radius:0;padding:0;background:transparent;min-height:40px}
.underline{border-bottom:1px solid rgba(32,31,29,.28)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;
  font-family:var(--serif);font-size:16px;background:transparent;border:1px solid transparent;
  border-radius:4px;min-height:52px;padding:0 18px;color:var(--text);width:100%}
.btn-primary{color:var(--accent-700);border-color:var(--accent)}
.btn-primary:hover{background:rgba(182,130,53,.12)}
.btn-primary:active{background:rgba(182,130,53,.22)}
.btn-secondary{border-color:var(--divider)}
.btn-secondary:hover{background:rgba(32,31,29,.06)}
.btn-ghost{color:var(--n800)}
.btn-ghost:hover{background:rgba(32,31,29,.05)}
.btn-inline{width:auto;justify-content:flex-start;padding-left:0;min-height:48px;font-size:15px}
.btn-row{display:flex;gap:10px}
.btn-row .btn{flex:1}

.box{border:1px solid var(--divider);border-radius:4px;padding:11px 12px;display:flex;align-items:center;gap:10px}
.box .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.box .tag,.fee .tag{font-size:11px;letter-spacing:.1em;color:var(--n500)}
.amt{width:128px;flex:none;display:flex;flex-direction:column;gap:3px}
.amt .tag{text-align:right}
.amt-in{display:flex;align-items:center;gap:4px;border-bottom:1px solid rgba(32,31,29,.28)}
.amt-in span{font-family:var(--num);font-size:13px;color:var(--accent-700)}
.amt-in input{text-align:right;font-family:var(--num);font-size:18px;font-variant-numeric:tabular-nums}
.qty{width:66px;flex:none;display:flex;flex-direction:column;gap:3px}
.qty .tag{text-align:right}
.qty input{text-align:right;font-family:var(--num);font-size:18px;font-variant-numeric:tabular-nums;
  border-bottom:1px solid rgba(32,31,29,.28)}
.fee{border:1px solid var(--divider);border-radius:4px;padding:11px 12px;display:flex;flex-direction:column;gap:8px}
.fee.paid{border-color:var(--accent)}
.fee-a{display:flex;align-items:center;gap:10px}
.fee-b{display:flex;align-items:flex-end;gap:12px;padding-left:32px}
.fee-f{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.fee-f input{border-bottom:1px solid rgba(32,31,29,.28)}
.fee-f.wide{flex:1.4}
.fee-f .amt-in input{text-align:left}
.paid-t{flex:none;min-width:64px;min-height:44px;padding:0 10px;border:1px solid var(--divider);
  border-radius:4px;background:transparent;cursor:pointer;font-family:var(--serif);font-size:14px;color:var(--danger)}
.fee.paid .paid-t{color:var(--accent-700);border-color:var(--accent)}
.paid-t:hover{background:rgba(32,31,29,.05)}
.no{width:22px;flex:none;font-family:var(--num);font-size:13px;color:var(--accent);font-variant-numeric:tabular-nums}
.x{width:40px;height:48px;flex:none;border:none;background:transparent;cursor:pointer;color:var(--n400);
  display:flex;align-items:center;justify-content:center;border-radius:4px}
.x:hover{color:var(--accent-700);background:rgba(32,31,29,.05)}

.summary{border:1px solid var(--accent-400);border-radius:4px;padding:18px;display:flex;flex-direction:column;gap:13px}
.summary .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.summary .row span:first-child{font-size:15px;color:var(--n800)}
.big{font-family:var(--display);font-weight:500;font-size:26px;font-variant-numeric:tabular-nums;line-height:1}
.bigger{font-size:32px}
.neg{color:var(--danger)}
.tri{display:flex;gap:0;border:1px solid var(--accent-400);border-radius:4px;padding:18px}
.tri>div{flex:1;display:flex;flex-direction:column;gap:7px;padding-left:16px;border-left:1px solid rgba(32,31,29,.14)}
.tri>div:first-child{padding-left:0;border-left:none}
.tri .lbl{font-size:12.5px;color:var(--n700)}

.pick{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:48px;
  padding:14px 16px;border-radius:4px;cursor:pointer;background:transparent;border:1px solid var(--divider);width:100%;text-align:left}
.pick:hover{background:rgba(32,31,29,.04)}
.pick.on{border-color:var(--accent)}
.pick .nm{font-size:18px;font-weight:500}
.pick .mt{font-family:var(--num);font-size:12.5px;color:var(--n600);font-variant-numeric:tabular-nums;margin-top:4px}
.mark{width:22px;height:22px;border-radius:50%;flex:none;border:1px solid var(--n400)}
.pick.on .mark{border-color:var(--accent);box-shadow:inset 0 0 0 4px var(--bg),inset 0 0 0 22px var(--accent)}

.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--hair);min-height:48px}
.li .nm{font-size:17.5px;font-weight:500}
.li .mt{font-family:var(--num);font-size:12.5px;color:var(--n600);font-variant-numeric:tabular-nums;margin-top:4px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--surface);
  border-top:1px solid var(--divider);padding:10px 6px calc(14px + env(safe-area-inset-bottom))}
.tabs .in{max-width:640px;margin:0 auto;display:flex;width:100%}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:52px;padding:6px 0;
  border:none;background:transparent;cursor:pointer;color:var(--n500);font-size:12px;letter-spacing:.06em}
.tab.on{color:var(--accent-700)}

.sheet{border:1px solid rgba(32,31,29,.22);background:var(--paper);padding:24px 20px;
  display:flex;flex-direction:column;gap:18px}
.sheet .hd{display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center}
.sheet .hd h3{font-family:var(--display);font-weight:400;font-size:22px;letter-spacing:.06em;margin:0}
.sheet .hd .sub{font-size:13px;color:var(--n700);font-variant-numeric:tabular-nums}
.sheet .hd .dash{width:46px;height:1px;background:var(--accent);margin-top:4px}
.sheet .grp{display:flex;flex-direction:column;gap:8px}
.sheet .grp>.lbl{font-size:12.5px;letter-spacing:.14em;color:var(--accent-700)}
.sr{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--hair);font-size:15px}
.sr.sum{border-bottom:none;padding-top:9px}
.sr.sum span:first-child{color:var(--n700)}
.sr.sum span:last-child{font-weight:500}
.total{border-top:1px solid rgba(32,31,29,.22);padding-top:14px;display:flex;justify-content:space-between;align-items:baseline}
.thead{display:flex;gap:10px;padding-bottom:7px;border-bottom:1px solid rgba(32,31,29,.22);
  font-size:11.5px;color:var(--accent-700);letter-spacing:.08em}
.trow{display:flex;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--hair);font-size:14.5px}
.foot{font-size:11.5px;line-height:1.7;color:var(--n600);text-align:center}
.c-no{width:22px;flex:none;font-family:var(--num);font-size:12.5px;color:var(--accent);font-variant-numeric:tabular-nums}
.c-nm{width:76px;flex:none;font-weight:500}
.c-gr{flex:1;font-family:var(--num);font-variant-numeric:tabular-nums;color:var(--n800)}
.c-id{flex:none;min-width:104px;text-align:right;font-family:var(--num);font-variant-numeric:tabular-nums}
.c-r{width:56px;flex:none;text-align:right;font-family:var(--num);font-variant-numeric:tabular-nums}

.modal{position:fixed;inset:0;z-index:50;background:rgba(32,31,29,.5);display:flex;align-items:flex-end;justify-content:center}
.modal-in{background:var(--bg);width:100%;max-width:640px;max-height:86vh;display:flex;flex-direction:column;
  border-top-left-radius:4px;border-top-right-radius:4px;border:1px solid var(--divider)}
.modal-hd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid var(--divider)}
.modal-hd h3{font-family:var(--display);font-weight:400;font-size:21px;margin:0}
.modal-body{flex:1;overflow:auto;padding:6px 18px}
.modal-ft{display:flex;gap:10px;padding:14px 18px calc(18px + env(safe-area-inset-bottom));border-top:1px solid var(--divider)}
.modal-ft .btn{flex:1}
.pick-row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--hair);cursor:pointer;min-height:48px}
.pick-row.dim{opacity:.45;cursor:default}
.pick-row input{width:22px;height:22px;flex:none;accent-color:var(--accent)}
.pick-nm{flex:1;font-size:17px;font-weight:500}
.pick-mt{font-family:var(--num);font-size:12.5px;color:var(--n600);font-variant-numeric:tabular-nums}
@media (min-width:720px){.modal{align-items:center}.modal-in{border-radius:4px;max-height:80vh}}
.hidden{display:none !important}
#print-area{display:none}
@media print{
  body{background:#fff}
  .app,.tabs{display:none !important}
  #print-area{display:block !important;padding:0}
  #print-area .sheet{border:none;background:#fff;padding:0;gap:16px;break-inside:auto}
  #print-area .sheet + .sheet{page-break-before:always;break-before:page;padding-top:0}
  #print-area .sheet{max-height:250mm;overflow:hidden}
  [data-noprint]{display:none !important}
  #print-area .sheet[data-fit]{transform:scale(var(--fit,1));transform-origin:top left;width:calc(100% / var(--fit,1));gap:10px}
  #print-area .sheet[data-fit] .trow{padding:4px 0}
  #print-area .trow{break-inside:avoid;page-break-inside:avoid}
  .trow,.sr{break-inside:avoid}
  @page{margin:16mm}
}
@media (min-width:720px){
  .app{max-width:720px;padding-bottom:120px}
  .stack{gap:28px}
}
</style>

function load(){
  var base = seed();
  try{
    var raw = localStorage.getItem(KEY);
    if(raw){
      var d = JSON.parse(raw);
      if(d && d.trips && d.trips.length){
        d.trips.forEach(function(t){
          if(!t.fees) t.fees = [];
          if(!t.feeDefault) t.feeDefault = 1700;
          if(!t.sponsors) t.sponsors = [];
          if(!t.going) t.going = [];
          if(!t.costs) t.costs = [];
        });
        base.trips = d.trips;
        base.currentId = d.currentId || d.trips[0].id;
      }
      if(d && d.roster && d.roster.length) base.roster = d.roster;
      // 補齊：舊資料裡沒有的人一律帶入，姓名相同者不重複
      var have = {};
      base.roster.forEach(function(r){ have[String(r.name).trim()] = r; });
      ROSTER.forEach(function(r){
        var cur = have[r.name];
        if(!cur){ base.roster.push({name:r.name,birth:r.birth,id:r.id}); have[r.name] = r; }
        else { if(!cur.birth && r.birth) cur.birth = r.birth; if(!cur.id && r.id) cur.id = r.id; }
      });
      if(d && d.puduEvents && d.puduEvents.length){
        base.puduEvents = d.puduEvents;
        base.puduId = d.puduId || d.puduEvents[0].id;
      }else if(d && d.pudu && d.pudu.length){
        base.puduEvents = [{
          id:'p'+(d.puduYear || '115'), year:String(d.puduYear || guessYear(d.puduDate) || '115'),
          name:d.puduName || '聖義堂普渡',
          date:String(d.puduDate || '').replace(/^\s*\d{3}\s*年\s*/, ''), price:d.puduPrice || 1680,
          note:d.puduNote || '', rows:d.pudu
        }];
        base.puduId = base.puduEvents[0].id;
      }
      base.puduEvents.forEach(function(ev){
        if(!ev.rows) ev.rows = [];
        if(!ev.year) ev.year = String(guessYear(ev.date) || '115');
        ev.date = String(ev.date || '').replace(/^\s*\d{3}\s*年\s*/, '');
        if(!ev.price) ev.price = 1680;
        ev.rows.forEach(function(p){
          if(p.tables !== undefined && p.boxes === undefined){ p.boxes = p.tables; p.bags = p.rice || ''; delete p.tables; delete p.rice; }
          p.amount = '';
          if(p.paid === undefined) p.paid = false;
        });
      });
      base.updatedAt = Number(d && d.updatedAt) || 0;
    }
  }catch(e){}
  return base;
}

function save(silent){

    setSaved('已存 ' + hh + ':' + mm + (CLOUD.url ? ' · 同步中…' : ''));

/* ── 雲端同步（Google 試算表 / Apps Script） ── */
function queuePush(){
  if(!CLOUD.url) return;
  CLOUD.pending = true;
  clearTimeout(CLOUD.timer);
  CLOUD.timer = setTimeout(pushCloud, 1200);
}

function pushCloud(cb){
  if(!CLOUD.url){ if(cb) cb(false,'尚未設定網址'); return; }
  if(CLOUD.busy){ CLOUD.pending = true; if(cb) cb(false,'同步中'); return; }
  CLOUD.busy = true;
  var stamp = S.updatedAt || Date.now();
  fetch(CLOUD.url, {
    method:'POST', redirect:'follow',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({data:snapshot(), updatedAt:stamp})
  }).then(function(r){ return r.json(); }).then(function(j){
    CLOUD.busy = false;
    if(j && j.ok){
      localStorage.setItem('shengyi-cloud-at', String(stamp));
      CLOUD.msg = '已同步到試算表 ' + clock();
      setSaved('已同步 ' + clock());
    }else{
      CLOUD.msg = '同步失敗：' + ((j && j.error) || '試算表回應異常');
      setSaved('同步失敗，資料仍在本機');
    }
    if(CLOUD.pending){ CLOUD.pending = false; queuePush(); }
    updateCloudBox();
    if(cb) cb(!!(j && j.ok), CLOUD.msg);
  }).catch(function(err){
    CLOUD.busy = false;
    CLOUD.msg = '連不上試算表（網址錯誤或未開放存取）';
    setSaved('同步失敗，資料仍在本機');
    updateCloudBox();
    if(cb) cb(false, CLOUD.msg);
  });
}

function pullCloud(cb){
  if(!CLOUD.url){ if(cb) cb(false,'尚未設定網址'); return; }
  CLOUD.msg = '讀取中…';
  updateCloudBox();
  fetch(CLOUD.url + (CLOUD.url.indexOf('?')>-1?'&':'?') + 't=' + Date.now(), {redirect:'follow'})
    .then(function(r){ return r.json(); }).then(function(j){
      if(!j || !j.ok){ CLOUD.msg = '讀取失敗：' + ((j && j.error) || '試算表回應異常'); updateCloudBox(); if(cb) cb(false); return; }
      if(!j.data){ CLOUD.msg = '試算表還是空的，會把這台的資料上傳'; updateCloudBox(); pushCloud(); if(cb) cb(true); return; }
      var mine = S.updatedAt || 0, theirs = Number(j.updatedAt) || 0;
      if(theirs > mine){
        adopt(j.data);
        CLOUD.msg = '已取回較新的雲端資料 ' + clock();
        save(true);
        render();
      }else if(mine > theirs){
        CLOUD.msg = '這台的資料較新，正在上傳…';
        pushCloud();
      }else{
        CLOUD.msg = '已是最新 ' + clock();
      }
      updateCloudBox();
      if(cb) cb(true);
    }).catch(function(){
      CLOUD.msg = '連不上試算表（網址錯誤或未開放存取）';
      updateCloudBox();
      if(cb) cb(false);
    });
}

function adopt(d){
  if(d.trips && d.trips.length){
    d.trips.forEach(function(t){
      if(!t.fees) t.fees = [];
      if(!t.feeDefault) t.feeDefault = 1700;
      if(!t.sponsors) t.sponsors = [];
      if(!t.going) t.going = [];
      if(!t.costs) t.costs = [];
    });
    S.trips = d.trips;
    S.currentId = d.currentId || d.trips[0].id;
  }
  if(d.roster) S.roster = d.roster;
  if(d.puduEvents && d.puduEvents.length){
    S.puduEvents = d.puduEvents;
    if(!S.puduEvents.some(function(x){ return String(x.id) === String(S.puduId); })) S.puduId = S.puduEvents[0].id;
  }
  S.updatedAt = Number(d.updatedAt) || Date.now();
}

var CRCT = (function(){
  var t = [], c, n, k;
  for(n=0;n<256;n++){ c=n; for(k=0;k<8;k++) c = (c&1) ? (0xEDB88320 ^ (c>>>1)) : (c>>>1); t[n]=c>>>0; }
  return t;
})();
function crc32(buf){
  var c = 0xFFFFFFFF;
  for(var i=0;i<buf.length;i++) c = CRCT[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function zipStore(files){
  var enc = new TextEncoder(), parts = [], central = [], offset = 0;
  function u16(n){ return [n & 255, (n>>>8) & 255]; }
  function u32(n){ return [n & 255, (n>>>8) & 255, (n>>>16) & 255, (n>>>24) & 255]; }
  files.forEach(function(f){
    var nameB = enc.encode(f.name), data = enc.encode(f.data), crc = crc32(data);
    var head = [].concat([80,75,3,4], u16(20), u16(0), u16(0), u16(0), u16(0),
      u32(crc), u32(data.length), u32(data.length), u16(nameB.length), u16(0));
    parts.push(new Uint8Array(head), nameB, data);
    central.push({name:nameB, crc:crc, size:data.length, off:offset});
    offset += head.length + nameB.length + data.length;
  });
  var cd = [], cdLen = 0;
  central.forEach(function(c){
    var h = [].concat([80,75,1,2], u16(20), u16(20), u16(0), u16(0), u16(0), u16(0),
      u32(c.crc), u32(c.size), u32(c.size), u16(c.name.length),
      u16(0), u16(0), u16(0), u16(0), u32(0), u32(c.off));
    cd.push(new Uint8Array(h), c.name);
    cdLen += h.length + c.name.length;
  });
  var endRec = new Uint8Array([].concat([80,75,5,6], u16(0), u16(0),
    u16(central.length), u16(central.length), u32(cdLen), u32(offset), u16(0)));
  return new Blob(parts.concat(cd, [endRec]), {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}

/* 樣式表：索引對應 XS.* */
var XS = {def:0, title:1, head:2, name:3, idx:4, cell:5, item:6,
  ptitle:7, phead:8, pcell:9, psmall:10, pcellS:11};

function stylesXml(){
  function font(sz, bold, face){
    return '<font><sz val="'+sz+'"/><name val="'+face+'"/><charset val="136"/>'+(bold?'<b/>':'')+'</font>';
  }
  var fonts = [font(11,0,'新細明體'), font(28,1,'新細明體'), font(22,1,'新細明體'),
    font(22,1,'細明體'), font(22,0,'新細明體'), font(28,1,'標楷體'), font(16,1,'標楷體'),
    font(20,1,'標楷體'), font(12,1,'標楷體'), font(13,1,'標楷體')];
  var bd = '<border><left style="thin"/><right style="thin"/><top style="thin"/><bottom style="thin"/></border>';
  function xf(fi, fill, border, h, wrap){
    return '<xf numFmtId="0" fontId="'+fi+'" fillId="'+fill+'" borderId="'+border+'" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1">'
      + '<alignment horizontal="'+h+'" vertical="center"'+(wrap?' wrapText="1"':'')+'/></xf>';
  }
  var xfs = [
    xf(0,0,0,'general'),        // def
    xf(1,0,0,'center'),         // title
    xf(2,2,1,'center'),         // head
    xf(3,2,1,'center'),         // name
    xf(2,0,1,'center'),         // idx
    xf(4,0,1,'center'),         // cell
    xf(2,0,1,'left'),           // item
    xf(5,0,1,'center',1),       // ptitle
    xf(6,0,1,'center'),         // phead
    xf(7,0,1,'center'),         // pcell
    xf(8,0,1,'center'),         // psmall
    xf(9,0,1,'center')          // pcellS
  ];
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
    + '<fonts count="'+fonts.length+'">'+fonts.join('')+'</fonts>'
    + '<fills count="3"><fill><patternFill patternType="none"/></fill>'
    + '<fill><patternFill patternType="gray125"/></fill>'
    + '<fill><patternFill patternType="solid"><fgColor rgb="FFEEECE1"/><bgColor indexed="64"/></patternFill></fill></fills>'
    + '<borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border>'+bd+'</borders>'
    + '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>'
    + '<cellXfs count="'+xfs.length+'">'+xfs.join('')+'</cellXfs>'
    + '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>';
}

function colName(i){
  var s = '';
  while(i > 0){ var m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = ((i - m) / 26) | 0; }
  return s;
}

/* sheet = {name, cols:[px], rows:[{h:px, cells:[{c,v,n,s,across}]}], fitWidth} */
function sheetXml(sh){
  var merges = [];
  var rowsX = sh.rows.map(function(r, ri){
    var rn = ri + 1, ci = 0;
    var cells = (r.cells || []).map(function(cell){
      ci = cell.c || (ci + 1);
      var ref = colName(ci) + rn;
      if(cell.across) merges.push(ref + ':' + colName(ci + cell.across) + rn);
      var sIdx = cell.s || 0, body = '';
      if(cell.v !== '' && cell.v !== null && cell.v !== undefined){
        body = cell.n
          ? '<v>' + (num(cell.v) || 0) + '</v>'
          : '<is><t xml:space="preserve">' + xesc(cell.v) + '</t></is>';
      }
      var t = (cell.n || !body) ? '' : ' t="inlineStr"';
      var out = '<c r="' + ref + '" s="' + sIdx + '"' + t + '>' + body + '</c>';
      if(cell.across) ci += cell.across;
      return out;
    }).join('');
    return '<row r="' + rn + '"' + (r.h ? ' ht="' + (r.h * 0.75).toFixed(1) + '" customHeight="1"' : '') + '>' + cells + '</row>';
  }).join('');

  var cols = (sh.cols || []).map(function(px, i){
    return '<col min="' + (i+1) + '" max="' + (i+1) + '" width="' + (px / 7.2).toFixed(2) + '" customWidth="1"/>';
  }).join('');

  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
    + '<sheetPr><pageSetUpPr fitToPage="1"/></sheetPr>'
    + '<sheetFormatPr defaultRowHeight="18"/>'
    + (cols ? '<cols>' + cols + '</cols>' : '')
    + '<sheetData>' + rowsX + '</sheetData>'
    + (merges.length ? '<mergeCells count="' + merges.length + '">'
        + merges.map(function(m){ return '<mergeCell ref="' + m + '"/>'; }).join('') + '</mergeCells>' : '')
    + '<pageMargins left="0.25" right="0.25" top="0.3" bottom="0.3" header="0.2" footer="0.2"/>'
    + '<pageSetup paperSize="9" orientation="portrait" fitToWidth="1" fitToHeight="'+(sh.fitPage ? 1 : 0)+'"/>'
    + '</worksheet>';
}

function xdownload(sheets, filename){
  var files = [
    {name:'[Content_Types].xml', data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
      + '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'
      + '<Default Extension="xml" ContentType="application/xml"/>'
      + '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'
      + sheets.map(function(s,i){ return '<Override PartName="/xl/worksheets/sheet'+(i+1)+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>'; }).join('')
      + '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'
      + '</Types>'},
    {name:'_rels/.rels', data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
      + '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>'
      + '</Relationships>'},
    {name:'xl/workbook.xml', data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      + '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" '
      + 'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'
      + sheets.map(function(s,i){
          return '<sheet name="'+xesc(String(s.name||('工作表'+(i+1))).slice(0,28))+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>';
        }).join('')
      + '</sheets></workbook>'},
    {name:'xl/_rels/workbook.xml.rels', data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
      + sheets.map(function(s,i){
          return '<Relationship Id="rId'+(i+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>';
        }).join('')
      + '<Relationship Id="rId'+(sheets.length+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>'
      + '</Relationships>'},
    {name:'xl/styles.xml', data:stylesXml()}
  ];
  sheets.forEach(function(s,i){ files.push({name:'xl/worksheets/sheet'+(i+1)+'.xml', data:sheetXml(s)}); });

  var url = URL.createObjectURL(zipStore(files));
  var link = document.createElement('a');
  link.href = url;
  link.download = filename;
  link.click();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
}

function rocTitle(t){
  var d = String(t.date||'').split(/[.\/-]/);
  var head = '';
  if(d.length >= 3) head = num(d[0]) + '年' + num(d[1]) + '/' + num(d[2]) + ' ';
  else if(t.date) head = t.date + ' ';
  var p = String(t.place||'').trim();
  if(!p) return head + '一日進香名單';
  if(p.indexOf('名單') > -1) return head + p;
  if(p.indexOf('進香') > -1) return head + p + '名單';
  return head + p + '一日進香名單';
}

var BAGS_PER_BOX = 8;

/* 一列的總包數（箱換算成包），金額一律用包數 × 單包價 */
function puduBags(p){ return num(p.boxes) * BAGS_PER_BOX + num(p.bags); }
function bagPrice(price){ return (num(price || pud().price) || 1680) / BAGS_PER_BOX; }
function puduAmount(p, price){ return Math.round(puduBags(p) * bagPrice(price)); }

/* 包數進位成「N箱M包」 */
function boxesBags(totalBags){
  return {boxes: Math.floor(totalBags / BAGS_PER_BOX), bags: totalBags % BAGS_PER_BOX};
}
function qtyText(totalBags){
  var q = boxesBags(totalBags);
  if(!totalBags) return '—';
  return (q.boxes ? q.boxes + '箱' : '') + (q.bags ? q.bags + '包' : '');
}
function puduTotals(){
  var totalBags = 0, due = 0, paid = 0, auto = 0;
  pud().rows.forEach(function(p){
    totalBags += puduBags(p);
    auto += puduAmount(p);
    var amt = String(p.amount).trim() ? num(p.amount) : puduAmount(p);
    due += amt;
    if(p.paid) paid += amt;
  });
  var q = boxesBags(totalBags);
  return {bagsTotal:totalBags, boxes:q.boxes, bags:q.bags, due:due, paid:paid,
    unpaid:due - paid, auto:auto, diff:due - auto};
}

function viewPuduPlain(){
  var rows = pud().rows, n = rows.length, T = puduTotals();
  var e = pud();
  var perCol = num(S.plainPerCol) || 13;
  var perPage = num(S.plainPerPage) || perCol * 2;
  var fs = perCol > 22 ? 17 : (perCol > 18 ? 19 : (perCol > 15 ? 21 : (perCol > 12 ? 23 : 25)));
  var head = (e.name || '普渡') + ' 米名單';
  var sub = (e.year ? e.year + '年' : '') + (e.date || '');

  function col(list){
    if(!list.length) return '';
    return '<div style="flex:1;min-width:0">'
      + '<div class="thead" style="font-size:'+Math.round(fs*0.62)+'px">'
      + '<div style="flex:1">姓名</div><div class="c-r" style="width:'+Math.round(fs*4.4)+'px">白米</div></div>'
      + list.map(function(p){
          var long = String(p.name||'').trim().length > 5;

            + '<div style="flex:1;font-weight:500;letter-spacing:.02em;font-size:'+(long?Math.round(fs*0.62):fs)+'px">'+esc(p.name||'—')+'</div>'
            + '<div class="c-r" style="width:'+Math.round(fs*4.4)+'px;font-weight:500">'+esc(puduQty(p))+'</div></div>';

  }

  var pages = [], i = 0;
  while(i < n){ pages.push(rows.slice(i, i + perPage)); i += perPage; }
  if(!pages.length) pages = [[]];

  var body = pages.map(function(pg, pi){
    return '<div class="sheet"'+(pi ? ' style="page-break-before:always"' : '')+'>'
      + '<div class="hd"><h3 style="font-size:'+(perCol>18?30:34)+'px;font-weight:600;line-height:1.25">'+esc(head)
      + '</h3>'
      + (sub ? '<div class="sub" style="font-size:'+Math.round(fs*0.62)+'px;margin-top:3px">'+esc(sub)+'</div>' : '')
      + '<div class="dash"></div></div>'
      + '<div style="display:flex;gap:26px;align-items:flex-start">'
      + col(pg.slice(0, perCol)) + col(pg.slice(perCol))
      + '</div>'
      + (pi === pages.length - 1
          ? '<div class="dash"></div><div class="trow" style="border-bottom:none;font-size:'+Math.round(fs*0.8)+'px">'
            + '<div style="flex:1"></div><div class="c-r" style="width:'+Math.round(fs*8)+'px;font-weight:500">白米 '+esc(qtyText(T.bagsTotal))+'</div></div>'
          : '')
      + '<div class="foot">製表 '+today()+'</div></div>';
  }).join('');

  var ctl = '<div class="col" data-noprint><div class="fee-b" style="padding-left:0">'
    + '<div class="fee-f"><div class="tag">每欄人數</div>'
    + '<input class="input bare num" inputmode="numeric" data-s="plainPerCol" value="'+esc(perCol)+'"></div>'
    + '<div class="fee-f"><div class="tag">每頁人數</div>'
    + '<input class="input bare num" inputmode="numeric" data-s="plainPerPage" value="'+esc(perPage)+'"></div>'
    + '</div><div class="muted">共 '+pages.length+' 頁 · 改數字即時重排</div></div>';

  return '<div class="stack">' + backBtn() + ctl + body
    + '<button class="btn btn-primary" data-act="print">列印 ／ 儲存為 PDF</button></div>';
}

function listOf(name){
  if(name === 'roster') return S.roster;
  if(name === 'pudu') return pud().rows;
  return trip()[name];
}

document.addEventListener('input', function(e){
  var el = e.target;
  if(el.dataset.s){ S[el.dataset.s] = el.value; save(); return; }
  if(el.dataset.pe){
    pud()[el.dataset.pe] = el.value;
    save();
    if(el.dataset.pe === 'price'){
      pud().rows.forEach(function(p, ix){
        var c = document.querySelector('[data-amt="'+ix+'"]');
        if(c) c.textContent = fmt(puduAmount(p));
      });
      refreshPudu();
    }
    return;
  }
  if(el.dataset.f){
    trip()[el.dataset.f] = el.value;
    save();
    if(el.dataset.f === 'feeDefault') return;
    return;
  }
  if(el.dataset.list){
    listOf(el.dataset.list)[+el.dataset.i][el.dataset.k] = el.value;
    save();
    if(el.dataset.list === 'costs' || el.dataset.list === 'sponsors' || el.dataset.list === 'fees') refreshSummary();
    if(el.dataset.list === 'pudu'){
      if(el.dataset.k === 'boxes' || el.dataset.k === 'bags'){
        var pr = pud().rows[+el.dataset.i];
        var cell = document.querySelector('[data-amt="'+el.dataset.i+'"]');
        if(cell && pr) cell.textContent = fmt(puduAmount(pr));
      }
      refreshPudu();
    }
  }
});

function refreshSummary(){
  var box = document.querySelector('.summary');
  if(!box) return;
  var t = trip(), unpaid = feeUnpaid(t), inc = income(t), cost = costTotal(t), bal = inc - cost;
  function set(k,v){ var el = box.querySelector('[data-sum="'+k+'"]'); if(el) el.textContent = v; }
  set('paid', fmt(feePaid(t)));
  set('unpaid', fmt(unpaid));
  set('spon', fmt(sponsorTotal(t)));
  set('inc', 'NT$'+fmt(inc));
  set('cost', '−'+fmt(cost));
  var u = box.querySelector('[data-sum="unpaid"]');
  if(u) u.className = 'num' + (unpaid>0?' neg':'');
  var b = box.querySelector('[data-sum="bal"]');
  if(b){
    b.textContent = (bal<0?'−NT$':'NT$') + fmt(Math.abs(bal));
    b.className = 'big bigger' + (bal<0?' neg':'');
  }
  var badge = document.querySelector('[data-fees-n]');
  if(badge) badge.textContent = t.fees.length + ' 人 · 未繳 ' + t.fees.filter(function(x){return !x.paid;}).length;
}
function refreshPudu(){
  var box = document.querySelector('.summary');
  if(!box) return;
  var T = puduTotals();
  function set(k,v){ var el = box.querySelector('[data-pd="'+k+'"]'); if(el) el.textContent = v; }
  set('n', pud().rows.length);
  set('qty', T.boxes + ' 箱 ' + T.bags + ' 包（共 ' + T.bagsTotal + ' 包）');
  set('auto', fmt(Math.round(bagPrice())) + ' / 包 · ' + fmt(num(pud().price)) + ' / 箱');
  set('due', 'NT$' + fmt(T.due));
  set('paid', fmt(T.paid));
  set('unpaid', fmt(T.unpaid));
  var u = box.querySelector('[data-pd="unpaid"]');
  if(u) u.className = 'num' + (T.unpaid > 0 ? ' neg' : '');
}

document.addEventListener('click', function(e){
  var el = e.target.closest('[data-tab],[data-act],[data-add],[data-del],[data-go],[data-trip],[data-paid],[data-pudupaid],[data-ungo],[data-deltrip],[data-pudugo],[data-delpudu],[data-move]');
  if(!el) return;

  if(el.dataset.tab){ S.tab = el.dataset.tab; S.screen = null; return render(); }

  if(el.dataset.go !== undefined){
    var t = trip(), n = el.dataset.go, k = t.going.indexOf(n);
    if(k > -1) t.going.splice(k,1); else t.going.push(n);
    save(); return render();
  }

  if(el.dataset.trip){
    var tid = el.dataset.trip;
    S.trips.forEach(function(x){ if(String(x.id) === tid) tid = x.id; });
    S.currentId = tid; S.tab = 'trip'; S.screen = null; save(); return render();
  }

  if(el.dataset.add){
    var nm = el.dataset.add;
    if(nm === 'fees') trip().fees.push({name:'',table:'',due:trip().feeDefault,paid:false});
    else if(nm === 'costs') trip().costs.push({name:'',amount:''});
    else if(nm === 'sponsors') trip().sponsors.push({name:'',amount:''});
    else if(nm === 'roster') S.roster.push({name:'',birth:'',id:''});
    else if(nm === 'pudu') pud().rows.push({name:'',boxes:'',bags:'',amount:'',paid:false});
    save(); render();
    var fields = document.querySelectorAll('[data-list="'+nm+'"][data-k="name"]');
    if(fields.length){
      var last = fields[fields.length-1];
      last.focus({preventScroll:true});
      var box = last.closest('.fee') || last.closest('.box') || last;
      var top = box.getBoundingClientRect().top + window.pageYOffset - 72;
      window.scrollTo(0, Math.max(0, top));
    }
    return;
  }

  if(el.dataset.ungo){
    var tg = trip(), ix = tg.going.indexOf(el.dataset.ungo);
    if(ix > -1) tg.going.splice(ix, 1);
    save(); return render();
  }

  if(el.dataset.move){
    var ml = listOf(el.dataset.mlist || 'roster');
    var mi = +el.dataset.i, mj = el.dataset.move === 'up' ? mi - 1 : mi + 1;
    if(!ml || mj < 0 || mj >= ml.length) return;
    var tmp = ml[mi]; ml[mi] = ml[mj]; ml[mj] = tmp;
    save(); return render();
  }

  if(el.dataset.pudugo){ S.puduId = el.dataset.pudugo; S.tab = 'pudu'; S.screen = null; save(); return render(); }

  if(el.dataset.delpudu){
    if(S.puduEvents.length < 2) return;
    var pe = null;
    S.puduEvents.forEach(function(x){ if(String(x.id) === String(el.dataset.delpudu)) pe = x; });
    if(!pe) return;
    if(!confirm('要刪除「'+(pe.year||'')+'年 '+(pe.name||'普渡')+'」整筆名單嗎？無法復原。')) return;
    S.puduEvents = S.puduEvents.filter(function(x){ return String(x.id) !== String(pe.id); });
    if(String(S.puduId) === String(pe.id)) S.puduId = S.puduEvents[0].id;
    save(); return render();
  }

  if(el.dataset.deltrip){
    var did = el.dataset.deltrip;
    var dt = null;
    S.trips.forEach(function(x){ if(String(x.id) === String(did)) dt = x; });
    if(!dt) return;
    if(!confirm('要刪除「'+(dt.place||'未命名')+' '+(dt.date||'')+'」整場活動嗎？收費、費用、贊助都會一起刪除，無法復原。')) return;
    S.trips = S.trips.filter(function(x){ return String(x.id) !== String(did); });
    if(!S.trips.length){
      var nid = Date.now();
      S.trips.push({id:nid, place:'', date:today(),
        costs:DEFAULT_COSTS.map(function(c){return {name:c.name,amount:c.amount};}),
        fees:[], feeDefault:1700, sponsors:[], going:[]});
    }
    if(String(S.currentId) === String(did)) S.currentId = S.trips[0].id;
    save(); return render();
  }

  if(el.dataset.pudupaid !== undefined){
    var pr = pud().rows[+el.dataset.pudupaid];
    pr.paid = !pr.paid;
    save();
    el.textContent = pr.paid ? '付清' : '未收';
    var w = el.closest('.fee');
    if(w) w.className = 'fee' + (pr.paid ? ' paid' : '');
    refreshPudu();
    return;
  }

  if(el.dataset.paid !== undefined){
    var t2 = trip(), row = t2.fees[+el.dataset.paid];
    row.paid = !row.paid;
    save();
    el.textContent = row.paid ? '已繳' : '未繳';
    var wrap = el.closest('.fee');
    if(wrap) wrap.className = 'fee' + (row.paid ? ' paid' : '');
    refreshSummary();
    return;
  }

  if(el.dataset.del){ listOf(el.dataset.del).splice(+el.dataset.i,1); save(); return render(); }

  var a = el.dataset.act;
  if(a === 'back'){ S.screen = null; return render(); }
  if(a === 'sheet'){ S.screen = 'sheet'; return render(); }
  if(a === 'insure'){ S.screen = 'insure'; return render(); }
  if(a === 'pudusheet'){ S.screen = 'pudusheet'; return render(); }
  if(a === 'puduplain'){ S.screen = 'puduplain'; return render(); }
  if(a === 'toroster'){ S.tab = 'roster'; S.screen = null; return render(); }

  if(a === 'fillfees'){ openPicker('fees'); return; }
  if(a === 'fillpudu'){ openPicker('pudu'); return; }
  if(a === 'pickclose'){ closePicker(); return; }
  if(a === 'pickall'){
    document.querySelectorAll('#picker input[type=checkbox]').forEach(function(c){ c.checked = true; });
    return;
  }
  if(a === 'pickconfirm'){ confirmPicker(); return; }

  if(a === 'cloudsave'){
    var v = (document.getElementById('cloudurl').value || '').trim();
    CLOUD.url = v;
    if(v) localStorage.setItem(URLKEY, v); else localStorage.removeItem(URLKEY);
    if(!v){ CLOUD.msg = '已取消連結'; updateCloudBox(); return; }
    CLOUD.msg = '連線中…'; updateCloudBox();
    pullCloud();
    return;
  }
  if(a === 'newpudu' || a === 'copypudu'){
    var src = pud();
    var yr = String(num(src.year) ? num(src.year) + 1 : new Date().getFullYear() - 1911);
    var nid = 'p' + Date.now();
    S.puduEvents.unshift({
      id:nid, year:yr, name:src.name || '聖義堂普渡', date:'', price:src.price || 1680, note:src.note || '',
      rows: a === 'copypudu'
        ? src.rows.map(function(p){ return {name:p.name, boxes:p.boxes, bags:p.bags, amount:'', paid:false}; })
        : []
    });
    S.puduId = nid; save(); return render();
  }

  if(a === 'delpudu'){
    if(S.puduEvents.length < 2) return;
    var cur = pud();
    if(!confirm('要刪除「'+(cur.year||'')+'年 '+(cur.name||'普渡')+'」整筆名單嗎？無法復原。')) return;
    S.puduEvents = S.puduEvents.filter(function(x){ return String(x.id) !== String(cur.id); });
    S.puduId = S.puduEvents[0].id;
    save(); return render();
  }

  if(a === 'cloudpull'){ pullCloud(); return; }
  if(a === 'cloudedit'){ S.showCloudUrl = !S.showCloudUrl; return render(); }
  if(a === 'cloudreset'){
    CLOUD.url = CLOUD_DEFAULT; localStorage.removeItem(URLKEY);
    S.showCloudUrl = false; CLOUD.msg = '已恢復預設網址'; render(); pullCloud(); return;
  }
  if(a === 'excel'){ downloadExcel(); return; }
  if(a === 'puduexcel'){ downloadPuduExcel(); return; }

  if(a === 'fillroster'){
    var have2 = {};
    S.roster.forEach(function(r){ have2[String(r.name).trim()] = r; });
    ROSTER.forEach(function(r){
      var cur = have2[r.name];
      if(!cur){ S.roster.push({name:r.name,birth:r.birth,id:r.id}); have2[r.name] = r; }
      else { if(!cur.birth && r.birth) cur.birth = r.birth; if(!cur.id && r.id) cur.id = r.id; }
    });
    save(); return render();
  }

  if(a === 'dedupe'){
    var seen = {}, out = [];
    S.roster.forEach(function(r){
      var k = String(r.name).trim();
      if(!k){ return; }
      if(seen[k]){
        var p = seen[k];
        if(!p.birth && r.birth) p.birth = r.birth;
        if(!p.id && r.id) p.id = r.id;
        return;
      }
      seen[k] = r; out.push(r);
    });
    S.roster = out; save(); return render();
  }

  if(a === 'newtrip'){
    var id = 't' + Date.now();
    var prev = trip();
    S.trips.unshift({id:id, place:'', date:today(),
      costs:(prev && prev.costs.length ? prev.costs : DEFAULT_COSTS).map(function(c){return {name:c.name,amount:c.amount};}),
      fees:[], feeDefault:(prev && prev.feeDefault) || 1700, sponsors:[], going:[]});
    S.currentId = id; S.tab = 'trip'; S.screen = null; save(); return render();
  }

  if(a === 'print'){
    var sheets = document.querySelectorAll('#view .sheet');
    if(sheets.length){
      var html = '';
      [].forEach.call(sheets, function(s){ html += s.outerHTML; });
      document.getElementById('print-area').innerHTML = html;
      window.print();
    }
    return;
  }

  if(a === 'export'){
    var data = JSON.stringify({v:3, trips:S.trips, roster:S.roster,
      puduEvents:S.puduEvents, puduId:S.puduId}, null, 2);
    var url = URL.createObjectURL(new Blob([data], {type:'application/json'}));
    var link = document.createElement('a');
    link.href = url;
    link.download = '聖義堂記帳備份-' + today().replace(/\./g,'') + '.json';
    link.click();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    return;
  }
});

document.addEventListener('change', function(e){
  var el = e.target;
  if(el.dataset && el.dataset.s){ S[el.dataset.s] = el.value; save(); return render(); }
  if(el.id === 'pudupick'){ S.puduId = el.value; save(); return render(); }
  if(el.dataset && el.dataset.list && el.dataset.k === 'name'
     && (el.dataset.list === 'fees' || el.dataset.list === 'sponsors' || el.dataset.list === 'pudu')){
    syncRoster(el.value);
  }
  if(el.id !== 'importer') return;
  var file = e.target.files && e.target.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    try{
      var d = JSON.parse(String(reader.result));
      if(d.trips && d.trips.length){ S.trips = d.trips; S.currentId = d.trips[0].id; }
      if(d.roster) S.roster = d.roster;
      if(d.puduEvents && d.puduEvents.length){ S.puduEvents = d.puduEvents; S.puduId = d.puduEvents[0].id; }
      else if(d.pudu && d.pudu.length){
        S.puduEvents.push({id:'p'+Date.now(), year:String(guessYear(d.puduDate)||''),
          name:d.puduName||'普渡',
          date:String(d.puduDate||'').replace(/^\s*\d{3}\s*年\s*/, ''), price:d.puduPrice||1680,
          note:d.puduNote||'', rows:d.pudu});
        S.puduId = S.puduEvents[S.puduEvents.length-1].id;
      }
      save(); render();
    }catch(err){
      var m = document.getElementById('importmsg');
      if(m){ m.textContent = '檔案讀不到內容，請確認是本 App 匯出的備份檔。'; m.style.color = 'var(--danger)'; }
    }
  };
  reader.readAsText(file);
});

render();

if(CLOUD.url){
  setTimeout(pullCloud, 60);
  document.addEventListener('visibilitychange', function(){
    if(!document.hidden) pullCloud();
  });
  window.addEventListener('online', function(){ pullCloud(); });
}
})();
</script>
