<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F1E2E">
<title>雅涵家的理財網</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --ink:#0F1E2E;--ink2:#1C3350;--slate:#42566E;--mute:#8A9BAF;
  --line:#E3E9F0;--bg:#F6F8FB;--card:#FFFFFF;
  --gold:#C9A227;--teal:#0E7C7B;--rose:#B33A3A;--amber:#D48806;
  --r:16px;--sh:0 1px 3px rgba(15,30,46,.06),0 8px 24px rgba(15,30,46,.05);
}
body{font-family:'Noto Sans TC',-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--ink);
  min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom));font-feature-settings:"tnum"}

/* ── Header ── */
.hd{background:linear-gradient(160deg,#0F1E2E 0%,#1C3350 100%);color:#fff;
  padding:18px 20px 16px;position:sticky;top:0;z-index:90}
.hd::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(201,162,39,.5),transparent)}
.hd-r{display:flex;align-items:flex-start;justify-content:space-between}
.hd-t{font-size:15px;font-weight:700;letter-spacing:.04em}
.hd-s{font-size:10px;color:rgba(255,255,255,.5);margin-top:3px;letter-spacing:.05em}
.hd-a{display:flex;align-items:center;gap:8px}
.bdg{font-size:9px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);
  border-radius:20px;padding:4px 10px;color:rgba(255,255,255,.75);letter-spacing:.03em}
.ib{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#fff;
  font-size:14px;width:32px;height:32px;border-radius:10px;cursor:pointer;
  display:flex;align-items:center;justify-content:center}
.ib:active{background:rgba(255,255,255,.2)}

/* Hero number */
.hero{margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.08)}
.hero-l{font-size:10px;color:rgba(255,255,255,.45);letter-spacing:.1em;text-transform:uppercase}
.hero-v{font-size:30px;font-weight:900;letter-spacing:-.02em;margin-top:2px;line-height:1.1}
.hero-m{font-size:11px;color:rgba(255,255,255,.55);margin-top:5px}
.hero-m b{color:rgba(255,255,255,.85);font-weight:700}

/* ── Month bar ── */
.mbar{display:flex;overflow-x:auto;gap:5px;padding:10px 16px;background:var(--card);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:89;scrollbar-width:none}
.mbar::-webkit-scrollbar{display:none}
.mb{flex-shrink:0;min-width:40px;padding:6px 12px;border-radius:9px;border:1px solid var(--line);
  font-size:12px;font-weight:500;cursor:pointer;background:var(--card);color:var(--mute);
  transition:all .16s;font-family:inherit}
.mb.has{color:var(--slate);border-color:#CBD7E4}
.mb.on{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:700}

.wrap{padding:14px 14px 0;max-width:560px;margin:0 auto}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--sh);margin-bottom:12px}
.ct{font-size:10px;font-weight:700;color:var(--mute);letter-spacing:.12em;text-transform:uppercase;
  margin-bottom:13px;display:flex;justify-content:space-between;align-items:center}
.ct em{font-style:normal;font-size:10px;color:#B8C4D2;letter-spacing:0;text-transform:none;font-weight:400}

/* ── Stat grid ── */
.sg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--line);
  border-radius:12px;overflow:hidden}
.si{background:var(--card);padding:13px 8px;text-align:center}
.sl{font-size:9px;color:var(--mute);letter-spacing:.06em;margin-bottom:5px}
.sv{font-size:17px;font-weight:900;letter-spacing:-.02em}
.sv.pos{color:var(--teal)}.sv.neg{color:var(--rose)}.sv.gold{color:var(--gold)}

/* ── Alert ── */
.al{border-radius:var(--r);padding:14px 16px;margin-bottom:12px;box-shadow:var(--sh);
  border-left:3px solid;background:var(--card);position:relative;overflow:hidden}
.al::before{content:'';position:absolute;inset:0;opacity:.045;pointer-events:none}
.al.ok{border-left-color:var(--teal)}.al.ok::before{background:var(--teal)}
.al.warn{border-left-color:var(--amber)}.al.warn::before{background:var(--amber)}
.al.bad{border-left-color:var(--rose)}.al.bad::before{background:var(--rose)}
.al-t{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
.al-m{font-size:15px;font-weight:700;letter-spacing:-.01em;margin-bottom:4px}
.al-s{font-size:11px;color:var(--slate);line-height:1.6}
.al.ok .al-m{color:var(--teal)}.al.warn .al-m{color:var(--amber)}.al.bad .al-m{color:var(--rose)}

/* ── Envelope rows ── */
.env{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;margin-bottom:12px}
.er{padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer;position:relative;transition:background .12s}
.er:last-child{border-bottom:none}
.er:active{background:#FAFCFE}
.er::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--ec,var(--line))}
.er-h{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.er-i{font-size:16px;width:22px;text-align:center;flex-shrink:0}
.er-n{font-size:13px;font-weight:700;flex:1;letter-spacing:.01em}
.er-p{font-size:10px;color:var(--mute);font-weight:500;letter-spacing:.02em}
.er-v{display:flex;align-items:baseline;gap:6px;margin-bottom:8px}
.er-a{font-size:19px;font-weight:900;letter-spacing:-.02em}
.er-b{font-size:10px;color:var(--mute)}
.bar{height:3px;background:#EDF1F6;border-radius:2px;overflow:hidden}
.bar-f{height:100%;border-radius:2px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.er-f{display:flex;justify-content:space-between;font-size:10px;color:var(--mute);margin-top:6px}
.er-st{font-weight:700;letter-spacing:.02em}
.st-ok{color:var(--teal)}.st-wn{color:var(--amber)}.st-ov{color:var(--rose)}

/* ── Data rows ── */
.dl{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.dr{display:flex;align-items:center;gap:10px;padding:12px 15px;border-bottom:1px solid var(--line)}
.dr:last-child{border-bottom:none}
.dr-i{font-size:15px;width:22px;text-align:center;flex-shrink:0;opacity:.85}
.dr-c{flex:1;min-width:0}
.dr-t{font-size:12.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dr-m{font-size:9.5px;color:var(--mute);margin-top:2px;letter-spacing:.03em}
.dr-a{font-size:13px;font-weight:700;flex-shrink:0;letter-spacing:-.01em}
.dr-a.out{color:var(--rose)}.dr-a.in{color:var(--teal)}
.dr-x{color:#D5DEE8;background:none;border:none;font-size:13px;cursor:pointer;padding:3px 4px;flex-shrink:0}
.dr-x:active{color:var(--rose)}

/* group header */
.gh{background:#F9FBFD;padding:8px 15px;font-size:9.5px;font-weight:700;color:var(--mute);
  letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid var(--line)}

/* editable */
.ed{display:flex;align-items:center;gap:9px;padding:11px 15px;border-bottom:1px solid var(--line)}
.ed:last-child{border-bottom:none}
.ed.sub{padding-left:30px;background:#FBFCFE}
.ed-n{flex:1;font-size:12px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--slate)}
.ed-n b{color:var(--ink);font-weight:500}
.ed-i{width:104px;border:1px solid var(--line);border-radius:9px;padding:8px 10px;
  font-size:13px;text-align:right;outline:none;font-weight:700;font-family:inherit;
  color:var(--ink);background:var(--card);transition:.15s}
.ed-i:focus{border-color:var(--ink2);box-shadow:0 0 0 3px rgba(28,51,80,.07)}
.ed-i[readonly]{background:#F4F7FA;color:var(--mute);font-weight:500}
.ed-v{width:104px;text-align:right;font-size:13px;font-weight:700;color:var(--ink);padding:8px 10px}

/* ── Tabs ── */
.tabs{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.97);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--line);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.tb{flex:1;border:none;background:none;padding:9px 2px 8px;cursor:pointer;color:#A9B7C6;
  font-size:9.5px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-family:inherit;position:relative;letter-spacing:.02em}
.tb .ti{font-size:17px;line-height:1}
.tb.on{color:var(--ink);font-weight:700}
.tb.on::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:22px;height:2px;background:var(--gold);border-radius:0 0 2px 2px}
.pg{display:none}.pg.on{display:block;animation:fi .22s ease}
@keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ── FAB ── */
.fab{position:fixed;bottom:calc(88px + env(safe-area-inset-bottom));right:18px;
  width:52px;height:52px;border-radius:17px;background:var(--ink);color:#fff;border:none;
  font-size:22px;font-weight:300;box-shadow:0 4px 14px rgba(15,30,46,.28);cursor:pointer;z-index:95;
  display:flex;align-items:center;justify-content:center}
.fab:active{transform:scale(.93)}

/* ── Sheet ── */
.ov{display:none;position:fixed;inset:0;background:rgba(15,30,46,.5);z-index:300;
  align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
.ov.on{display:flex}
.sh{background:var(--card);border-radius:22px 22px 0 0;padding:8px 18px calc(26px + env(safe-area-inset-bottom));
  width:100%;max-width:560px;max-height:88vh;overflow-y:auto;animation:su .26s cubic-bezier(.2,.9,.3,1)}
@keyframes su{from{transform:translateY(100%)}to{transform:none}}
.sh-g{width:34px;height:4px;background:var(--line);border-radius:2px;margin:0 auto 14px}
.sh h3{font-size:15px;font-weight:700;margin-bottom:15px;letter-spacing:.02em}
.fl{margin-bottom:13px}
.fl label{font-size:9.5px;font-weight:700;color:var(--mute);display:block;margin-bottom:6px;letter-spacing:.09em;text-transform:uppercase}
.fl input,.fl select{width:100%;border:1px solid var(--line);border-radius:11px;padding:12px 13px;
  font-size:15px;outline:none;background:var(--card);font-family:inherit;color:var(--ink);font-weight:500}
.fl input:focus{border-color:var(--ink2);box-shadow:0 0 0 3px rgba(28,51,80,.07)}
.cp{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cb{border:1px solid var(--line);border-radius:11px;padding:9px 2px;text-align:center;
  cursor:pointer;background:var(--card);transition:.14s}
.cb.sel{border-color:var(--ink);background:var(--ink);color:#fff}
.cb .cbi{font-size:16px;display:block;margin-bottom:3px}
.cb .cbn{font-size:8.5px;line-height:1.2;color:var(--slate);letter-spacing:.01em}
.cb.sel .cbn{color:rgba(255,255,255,.9)}
.br{display:flex;gap:8px;margin-top:16px}
.btn{flex:1;padding:13px;border-radius:12px;border:none;font-size:14px;font-weight:700;
  cursor:pointer;font-family:inherit;letter-spacing:.02em}
.bp{background:var(--ink);color:#fff}.bp:disabled{background:#B7C3D0}
.bc{background:#EFF3F7;color:var(--slate)}

.chw{position:relative;height:220px}
.emp{text-align:center;padding:36px 18px;color:#B8C4D2;font-size:12.5px}
.emp .ei{font-size:30px;margin-bottom:9px;opacity:.55}
.spin{display:inline-block;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:calc(92px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  background:var(--ink);color:#fff;font-size:12px;font-weight:500;padding:11px 19px;border-radius:11px;
  z-index:999;opacity:0;transition:opacity .28s;pointer-events:none;max-width:88vw;text-align:center;
  box-shadow:0 6px 20px rgba(15,30,46,.25);letter-spacing:.02em}
.toast.on{opacity:1}
.errb{background:#FDF6F6;border-left:3px solid var(--rose);border-radius:var(--r);padding:14px 16px;margin-bottom:12px}
.errb .t{font-weight:700;color:var(--rose);margin-bottom:5px;font-size:12.5px}
.errb .m{font-size:11px;color:var(--slate);margin-bottom:10px;line-height:1.6}
.mini{background:var(--ink);color:#fff;border:none;border-radius:9px;padding:6px 13px;
  font-size:11px;font-weight:600;cursor:pointer;font-family:inherit}
.tip{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:12px;
  border-left:3px solid var(--gold)}
.tip-h{font-size:10px;font-weight:700;color:var(--mute);letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px}
.tip-m{font-size:14px;font-weight:700;line-height:1.55;margin-bottom:10px;letter-spacing:.01em}
.tip-l{list-style:none}
.tip-l li{font-size:12.5px;color:var(--slate);line-height:1.75;padding-left:18px;position:relative;margin-bottom:7px}
.tip-l li::before{content:'▸';position:absolute;left:2px;color:var(--gold);font-size:11px}
.tip-l li b{color:var(--ink);font-weight:700}
.tip-goal{background:#F9FBFD;border-radius:11px;padding:12px 14px;margin-top:12px;
  font-size:12px;color:var(--slate);line-height:1.7}
.tip-goal b{color:var(--teal);font-weight:700;font-size:14px}
.sortbar{display:flex;gap:4px}
.sb{border:1px solid var(--line);background:var(--card);color:var(--mute);border-radius:8px;
  padding:4px 10px;font-size:10px;font-weight:600;cursor:pointer;font-family:inherit;letter-spacing:.03em}
.sb.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.ro{font-size:9px;color:var(--mute);background:#F4F7FA;border:1px solid var(--line);
  border-radius:6px;padding:2px 7px;letter-spacing:.04em;font-weight:500}
</style>
</head>
<body>

<div class="hd">
  <div class="hd-r">
    <div>
      <div class="hd-t" id="pgT">雅涵家的理財網</div>
      <div class="hd-s" id="pgS">GOOGLE SHEETS · 即時同步</div>
    </div>
    <div class="hd-a">
      <span class="bdg" id="upd">載入中</span>
      <button class="ib" onclick="loadAll(1)">↻</button>
    </div>
  </div>
  <div class="hero" id="hero">
    <div class="hero-l" id="heroL">本月支出</div>
    <div class="hero-v" id="heroV">—</div>
    <div class="hero-m" id="heroM">—</div>
  </div>
</div>

<div class="mbar" id="mbar"></div>

<!-- 錢包 -->
<div class="pg on" id="pg-wallet"><div class="wrap">
  <div id="alert"></div>
  <div class="ct" style="margin:4px 3px 10px">各類別預算</div>
  <div class="env" id="envs"><div class="emp"><span class="spin ei">◌</span><br>正在同步 Google Sheets…</div></div>
</div></div>

<!-- 明細 -->
<div class="pg" id="pg-detail"><div class="wrap">
  <div class="ct" style="margin:4px 3px 10px">
    <span>本月支出明細 <em id="detCnt"></em></span>
    <span class="sortbar">
      <button class="sb on" id="sb-date" onclick="setSort('date')">日期</button>
      <button class="sb" id="sb-amt" onclick="setSort('amt')">金額 ↓</button>
    </span>
  </div>
  <div class="dl" id="txs"><div class="emp">載入中</div></div>
</div></div>

<!-- 收入 -->
<div class="pg" id="pg-income"><div class="wrap">
  <div class="card">
    <div class="ct">本月收支</div>
    <div class="sg">
      <div class="si"><div class="sl">收入</div><div class="sv pos" id="iIn">—</div></div>
      <div class="si"><div class="sl">支出</div><div class="sv neg" id="iOut">—</div></div>
      <div class="si"><div class="sl">結餘</div><div class="sv" id="iNet">—</div></div>
    </div>
  </div>
  <div class="ct" style="margin:16px 3px 10px">收入項目 <em>輸入即存檔</em></div>
  <div class="dl" id="incs"><div class="emp">載入中</div></div>
</div></div>

<!-- 資產 -->
<div class="pg" id="pg-asset"><div class="wrap">
  <div class="card">
    <div class="ct">資產概況</div>
    <div class="sg">
      <div class="si"><div class="sl">總資產</div><div class="sv" id="aT">—</div></div>
      <div class="si"><div class="sl">月增減</div><div class="sv" id="aD">—</div></div>
      <div class="si"><div class="sl">存款率</div><div class="sv" id="aR">—</div></div>
    </div>
  </div>
  <div class="ct" style="margin:16px 3px 10px">帳戶餘額 <em>輸入即存檔</em></div>
  <div class="dl" id="accs"><div class="emp">載入中</div></div>
</div></div>

<!-- 投資＋保險 -->
<div class="pg" id="pg-more"><div class="wrap">
  <div class="card">
    <div class="ct">本月投資 <span class="ro">唯讀</span></div>
    <div class="sg">
      <div class="si"><div class="sl">自己出的錢</div><div class="sv" id="vSelf">—</div></div>
      <div class="si"><div class="sl">子女教育</div><div class="sv" id="vKid">—</div></div>
      <div class="si"><div class="sl">本月合計</div><div class="sv gold" id="vSum">—</div></div>
    </div>
  </div>
  <div class="ct" style="margin:16px 3px 10px">投資明細 <em>請至 Excel 修改</em></div>
  <div class="dl" id="invs"><div class="emp">載入中</div></div>
</div></div>

<!-- 分析 -->
<div class="pg" id="pg-chart"><div class="wrap">
  <div id="tips"></div>
  <div class="card"><div class="ct">這個月錢花去哪</div><div class="chw"><canvas id="c1"></canvas></div></div>
  <div class="card"><div class="ct">每月賺多少 vs 花多少</div><div class="chw"><canvas id="c2"></canvas></div></div>
  <div class="card"><div class="ct">存款有沒有變多</div><div class="chw"><canvas id="c3"></canvas></div></div>
</div></div>

<button class="fab" id="fab" onclick="openAdd()">＋</button>

<div class="tabs">
  <button class="tb on" data-p="wallet" onclick="go('wallet')"><span class="ti">◈</span>預算</button>
  <button class="tb" data-p="detail" onclick="go('detail')"><span class="ti">☰</span>明細</button>
  <button class="tb" data-p="income" onclick="go('income')"><span class="ti">◉</span>收入</button>
  <button class="tb" data-p="asset"  onclick="go('asset')"><span class="ti">▤</span>資產</button>
  <button class="tb" data-p="more"   onclick="go('more')"><span class="ti">◇</span>投資</button>
  <button class="tb" data-p="chart"  onclick="go('chart')"><span class="ti">◫</span>分析</button>
</div>

<div class="ov" id="ovAdd" onclick="if(event.target===this)cl('ovAdd')">
  <div class="sh">
    <div class="sh-g"></div>
    <h3>記一筆支出</h3>
    <div class="fl"><label>類別</label><div class="cp" id="cp"></div></div>
    <div class="fl"><label>金額</label><input type="number" id="fAmt" placeholder="0" inputmode="decimal"></div>
    <div class="fl"><label>說明</label><input type="text" id="fDesc" placeholder="選填"></div>
    <div class="fl"><label>日期</label><input type="date" id="fDate"></div>
    <div class="br">
      <button class="btn bc" onclick="cl('ovAdd')">取消</button>
      <button class="btn bp" id="fBtn" onclick="submitExp()">確認記錄</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API='https://script.google.com/macros/s/AKfycbwKHbmVj4vtex2u9zxPt8fS8UNuaVmpGI1pRSJCIZu1tDk9q8IWmp1xZnxI7w9EIJRQ/exec';

const CL={'🍽️ 飲食':'#D4763C','🏠 居家開銷':'#0E7C7B','🚗 汽車':'#B33A3A',
'🛍️ 娛樂血拚':'#7D5BA6','🏥 看醫生':'#2E6DA4','📚 終身學習':'#2E7D52',
'🛡️ 保險':'#C9A227','👶 小孩學習':'#B4468E','📱 網路訂閱':'#14868C',
'🧸 小孩日用品':'#C2557A','💬 其他':'#78899B'};
const MN=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
const TT={wallet:['雅涵家的理財網','GOOGLE SHEETS · 即時同步'],detail:['支出明細','點右側 ✕ 可刪除'],
income:['收入記錄','輸入後自動存回 SHEETS'],asset:['資產追蹤','輸入後自動存回 SHEETS'],
more:['投資記錄','唯讀 · 請至 EXCEL 修改'],chart:['財務分析','全年趨勢概覽']};

let D={expenses:{},income:{rows:[],months:{}},assets:{accounts:[],totals:{}},
  budgets:{},invest:{rows:[],months:{},breakdown:{}}};
let cm=new Date().getMonth()+1,pg='wallet',sel=null,c1,c2,c3,sortBy='date';

const F=n=>'NT$'+Math.round(n).toLocaleString('zh-TW');
const F2=n=>Math.round(n).toLocaleString('zh-TW');
const P=n=>String(n).padStart(2,'0');
const E=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');

const LS='famBudgetCache';

// 帶逾時的 fetch（預設 20 秒）
function fetchT(url,ms){
  return Promise.race([
    fetch(url,{redirect:'follow'}),
    new Promise((_,rej)=>setTimeout(()=>rej(new Error('連線逾時')),ms||20000))
  ]);
}

async function api(q,tries){
  tries=tries||2;
  let err;
  for(let i=0;i<tries;i++){
    try{
      const r=await fetchT(API+'?'+new URLSearchParams(q),20000);
      const t=await r.text();
      const j=JSON.parse(t);
      if(j.error)throw new Error(j.error);
      return j;
    }catch(e){
      err=e;
      if(i<tries-1)await new Promise(r=>setTimeout(r,900));  // 等 0.9 秒再試
    }
  }
  throw err;
}

function saveCache(){
  try{localStorage.setItem(LS,JSON.stringify({d:D,t:Date.now()}));}catch(e){}
}
function loadCache(){
  try{
    const c=JSON.parse(localStorage.getItem(LS)||'null');
    if(!c||!c.d)return null;
    return c;
  }catch(e){return null;}
}

function applyData(j){
  D.expenses=j.expenses||{};
  D.income=j.income||{rows:[],months:{}};
  D.assets=j.assets||{accounts:[],totals:{}};
  D.budgets=j.budgets||{};
  D.invest=j.invest||{rows:[],months:{},breakdown:{}};
}

let booted=false;

async function loadAll(m){
  const badge=document.getElementById('upd');

  // 首次開啟：先用本地快取秒開，再背景更新
  if(!booted){
    const c=loadCache();
    if(c){
      D=c.d;
      const ms=Object.keys(D.expenses).map(Number).filter(x=>Object.keys(D.expenses[x]||{}).length);
      if(ms.length)cm=Math.max(...ms);
      rAll();
      const mins=Math.round((Date.now()-c.t)/60000);
      badge.textContent=mins<1?'剛更新':(mins<60?mins+' 分鐘前':'更新中…');
    }
    booted=true;
  }

  if(m)tst('更新中…');
  badge.textContent=badge.textContent==='載入中'?'載入中':'同步中…';

  try{
    const j=await api({action:'read',force:m?'1':'0'});
    applyData(j);
    if(!m){
      const ms=Object.keys(D.expenses).map(Number).filter(x=>Object.keys(D.expenses[x]||{}).length);
      if(ms.length&&!loadCache())cm=Math.max(...ms);
    }
    saveCache();
    const n=new Date();
    badge.textContent=`${n.getMonth()+1}/${n.getDate()} ${P(n.getHours())}:${P(n.getMinutes())}`;
    rAll();
    if(m)tst('已更新');
  }catch(e){
    const c=loadCache();
    if(c){
      badge.textContent='離線資料';
      if(m)tst('連線失敗，顯示上次資料');
    }else{
      badge.textContent='連線失敗';
      document.getElementById('envs').innerHTML=
        `<div class="errb"><div class="t">無法載入資料</div><div class="m">${E(e.message)}</div>
         <button class="mini" onclick="loadAll(1)">重新載入</button></div>`;
    }
  }
}

function go(p){
  pg=p;
  document.querySelectorAll('.pg').forEach(e=>e.classList.toggle('on',e.id==='pg-'+p));
  document.querySelectorAll('.tb').forEach(e=>e.classList.toggle('on',e.dataset.p===p));
  document.getElementById('pgT').textContent=TT[p][0];
  document.getElementById('pgS').textContent=TT[p][1];
  document.getElementById('fab').style.display=(p==='wallet'||p==='detail')?'flex':'none';
  document.getElementById('mbar').style.display=(p==='chart')?'none':'flex';
  document.getElementById('hero').style.display=(p==='chart')?'none':'block';
  rHero();
  if(p==='chart')draw();
  window.scrollTo(0,0);
}

function mbar(){
  const b=document.getElementById('mbar');b.innerHTML='';
  MN.forEach((l,i)=>{
    const m=i+1,x=document.createElement('button');
    x.className='mb';x.textContent=l;
    if(Object.keys(D.expenses[m]||{}).length||D.income.months[m])x.classList.add('has');
    if(m===cm)x.classList.add('on');
    x.onclick=()=>{cm=m;rAll();};
    b.appendChild(x);
  });
}

function rAll(){
  mbar();rHero();rWallet();
  // 其他分頁延後渲染，讓首屏更快
  requestAnimationFrame(()=>{rDetail();rIncome();rAsset();rMore();if(pg==='chart')draw();});
}

function rHero(){
  const md=D.expenses[cm]||{};
  const exp=Object.values(md).reduce((s,c)=>s+c.total,0);
  const inc=D.income.months[cm]||0;
  const tb=Object.values(D.budgets).reduce((a,b)=>a+b,0);
  const L=document.getElementById('heroL'),V=document.getElementById('heroV'),M=document.getElementById('heroM');
  if(pg==='income'){L.textContent='本月結餘';V.textContent=(inc||exp)?F(inc-exp):'—';
    M.innerHTML=`收入 <b>${F2(inc)}</b> · 支出 <b>${F2(exp)}</b>`;}
  else if(pg==='asset'){const t=D.assets.totals[cm]||0,p=D.assets.totals[cm-1]||0;
    L.textContent='家庭總資產';V.textContent=t?F(t):'—';
    M.innerHTML=(t&&p)?`較上月 <b>${(t-p)>=0?'+':''}${F2(t-p)}</b>`:'—';}
  else if(pg==='more'){const iv=D.invest.months[cm]||0;
    const bd=D.invest.breakdown[cm]||{};
    const sf=Object.keys(bd).filter(k=>k.indexOf('自己')>-1).reduce((a,k)=>a+bd[k],0);
    L.textContent='本月投資金額';V.textContent=iv?F(iv):'—';
    M.innerHTML=iv?`自己出 <b>${F2(sf)}</b> · 其他 <b>${F2(iv-sf)}</b>`:'尚無記錄';}
  else{L.textContent='本月支出';V.textContent=exp?F(exp):'—';
    M.innerHTML=exp?`預算 <b>${F2(tb)}</b> · 剩餘 <b>${F2(tb-exp)}</b>`:'尚無記錄';}
}

function rWallet(){
  const md=D.expenses[cm]||{};
  const tot=Object.values(md).reduce((s,c)=>s+c.total,0);
  const tb=Object.values(D.budgets).reduce((a,b)=>a+b,0);
  rAlert(tot,tb);
  const el=document.getElementById('envs');el.innerHTML='';
  const cs=Object.keys(D.budgets);
  if(!cs.length){el.innerHTML='<div class="emp"><div class="ei">◌</div>尚未設定預算</div>';return;}
  cs.forEach(c=>{
    const bg=D.budgets[c]||0,us=(md[c]||{total:0}).total,rm=bg-us,pc=bg>0?us/bg:0;
    const col=CL[c]||'#8A9BAF';
    const bc=pc>=1?'#B33A3A':pc>=.8?'#D48806':'#0E7C7B';
    const sc=pc>=1?'st-ov':pc>=.8?'st-wn':'st-ok';
    const st=pc>=1?`超支 ${F2(-rm)}`:pc>=.8?'接近上限':'正常';
    const d=document.createElement('div');
    d.className='er';d.onclick=()=>openAdd(c);
    d.style.setProperty('--ec',col);
    d.innerHTML=`<div class="er-h"><span class="er-i">${c.slice(0,2)}</span>
        <span class="er-n">${c.slice(2).trim()}</span>
        <span class="er-p">${tot?(us/tot*100).toFixed(0):0}%</span></div>
      <div class="er-v"><span class="er-a" style="color:${rm<0?'#B33A3A':'#0F1E2E'}">${F(rm)}</span>
        <span class="er-b">／ ${F2(bg)}</span></div>
      <div class="bar"><div class="bar-f" style="width:${Math.min(100,pc*100)}%;background:${bc}"></div></div>
      <div class="er-f"><span>已用 ${F2(us)}</span><span class="er-st ${sc}">${st}</span></div>`;
    el.appendChild(d);
  });
}

function rAlert(tot,tb){
  const a=document.getElementById('alert'),n=new Date();
  if(cm!==n.getMonth()+1||!tot){a.innerHTML='';return;}
  const dim=new Date(n.getFullYear(),cm,0).getDate(),td=n.getDate(),dl=dim-td;
  const av=tot/td,pj=Math.round(tot+av*dl),df=pj-tb;
  let cs,tl,ms,sb;
  if(df<=0){cs='ok';tl='月底預測';ms=`預計剩餘 ${F(Math.abs(df))}`;
    sb=`目前日均 ${F2(Math.round(av))}，剩餘 ${dl} 天`;}
  else if(df<tb*.1){cs='warn';tl='預算警示';ms=`預計超支 ${F(df)}`;
    sb=`剩 ${dl} 天，每日需控制在 ${F2(Math.round((tb-tot)/Math.max(dl,1)))} 以內`;}
  else{cs='bad';tl='超支警告';ms=`預計超支 ${F(df)}`;
    sb=`剩 ${dl} 天，每日僅剩 ${F2(Math.max(0,Math.round((tb-tot)/Math.max(dl,1))))} 可用`;}
  a.innerHTML=`<div class="al ${cs}"><div class="al-t">${tl} · ${cm}/${td}</div>
    <div class="al-m">${ms}</div><div class="al-s">${sb}</div></div>`;
}

function setSort(m){sortBy=m;
  document.getElementById('sb-date').classList.toggle('on',m==='date');
  document.getElementById('sb-amt').classList.toggle('on',m==='amt');
  rDetail();}

function rDetail(){
  const md=D.expenses[cm]||{},all=[];
  Object.keys(md).forEach(c=>md[c].items.forEach(i=>all.push(Object.assign({cat:c},i))));
  if(sortBy==='amt')all.sort((a,b)=>b.amt-a.amt);
  else all.sort((a,b)=>b.date.localeCompare(a.date));
  document.getElementById('detCnt').textContent=all.length?`${all.length} 筆`:'';
  const el=document.getElementById('txs');
  if(!all.length){el.innerHTML='<div class="emp"><div class="ei">◌</div>本月尚無支出</div>';return;}
  el.innerHTML=all.map(t=>`<div class="dr">
    <span class="dr-i">${t.cat.slice(0,2)}</span>
    <div class="dr-c"><div class="dr-t">${E(t.desc)||t.cat.slice(2).trim()}</div>
      <div class="dr-m">${t.date} · ${t.cat.slice(2).trim()}</div></div>
    <span class="dr-a out">−${F2(t.amt)}</span>
    <button class="dr-x" onclick="delEx(${t.row})">✕</button></div>`).join('');
}

function rIncome(){
  const inc=D.income.months[cm]||0;
  const exp=Object.values(D.expenses[cm]||{}).reduce((s,c)=>s+c.total,0);
  document.getElementById('iIn').textContent=inc?F2(inc):'—';
  document.getElementById('iOut').textContent=exp?F2(exp):'—';
  const n=document.getElementById('iNet');
  n.textContent=(inc||exp)?F2(inc-exp):'—';
  n.className='sv '+((inc-exp)>=0?'pos':'neg');
  const el=document.getElementById('incs');
  if(!D.income.rows.length){el.innerHTML='<div class="emp">無資料</div>';return;}
  el.innerHTML=D.income.rows.map(r=>{
    const ro=r.name.indexOf('合計')>-1;
    return `<div class="ed ${r.isSub?'sub':''}"><span class="ed-n">${E(r.name)}</span>
      <input class="ed-i" type="number" inputmode="decimal" value="${r.values[cm]||''}"
        ${ro?'readonly':''} onchange="svIn(${r.row},this.value,this)"></div>`;}).join('');
}

function rAsset(){
  const t=D.assets.totals[cm]||0,p=D.assets.totals[cm-1]||0;
  const dl=(t&&p)?t-p:0,inc=D.income.months[cm]||0;
  const rt=(dl&&inc)?(dl/inc*100):0;
  document.getElementById('aT').textContent=t?F2(t):'—';
  const d=document.getElementById('aD');
  d.textContent=dl?(dl>=0?'+':'')+F2(dl):'—';d.className='sv '+(dl>=0?'pos':'neg');
  const r=document.getElementById('aR');
  r.textContent=rt?rt.toFixed(0)+'%':'—';
  r.className='sv '+(rt>=30?'pos':rt>0?'gold':'neg');
  const el=document.getElementById('accs');
  if(!D.assets.accounts.length){el.innerHTML='<div class="emp">無資料</div>';return;}
  el.innerHTML=D.assets.accounts.map(a=>`<div class="ed">
    <span class="ed-n"><b>${E(a.name)}</b>${a.owner?` · ${E(a.owner)}`:''}</span>
    <input class="ed-i" type="number" inputmode="decimal" value="${a.values[cm]||''}"
      onchange="svAs(${a.row},this.value,this)"></div>`).join('');
}

function rMore(){
  const bd=D.invest.breakdown[cm]||{};
  const iv=D.invest.months[cm]||0;
  let sf=0,kd=0;
  Object.keys(bd).forEach(k=>{
    if(k.indexOf('自己')>-1)sf+=bd[k];
    else if(k.indexOf('子女')>-1||k.indexOf('教育')>-1)kd+=bd[k];
  });
  document.getElementById('vSelf').textContent=sf?F2(sf):'—';
  document.getElementById('vKid').textContent=kd?F2(kd):'—';
  document.getElementById('vSum').textContent=iv?F2(iv):'—';

  const ie=document.getElementById('invs');
  const ir=D.invest.rows.filter(r=>r.values[cm]);
  if(!ir.length){ie.innerHTML='<div class="emp"><div class="ei">◌</div>本月無投資記錄</div>';return;}
  let h='',ls='';
  ir.forEach(r=>{
    if(r.src&&r.src!==ls){h+=`<div class="gh">${E(r.src)}</div>`;ls=r.src;}
    h+=`<div class="ed"><span class="ed-n"><b>${E(r.name)}</b></span>
      <span class="ed-v">${F2(r.values[cm])}</span></div>`;});
  ie.innerHTML=h;
}

async function svIn(row,v,el){
  el.disabled=true;
  try{const j=await api({action:'setIncome',row,month:cm,value:v});
    D.income=j.income;saveCache();rHero();rIncome();mbar();tst('已儲存');}
  catch(e){tst(e.message);}
  el.disabled=false;
}
async function svAs(row,v,el){
  el.disabled=true;
  try{const j=await api({action:'setAsset',row,month:cm,value:v});
    D.assets=j.assets;saveCache();rHero();rAsset();tst('已儲存');}
  catch(e){tst(e.message);}
  el.disabled=false;
}
async function delEx(row){
  if(!confirm('確定刪除這筆支出？'))return;
  tst('刪除中…');
  try{const j=await api({action:'delExpense',row});D.expenses=j.expenses;saveCache();rAll();tst('已刪除');}
  catch(e){tst(e.message);}
}

function openAdd(pc){
  sel=pc||null;
  document.getElementById('cp').innerHTML=Object.keys(D.budgets).map(c=>
    `<div class="cb ${c===sel?'sel':''}" data-c="${encodeURIComponent(c)}" onclick="pk(this)">
      <span class="cbi">${c.slice(0,2)}</span><span class="cbn">${c.slice(2).trim()}</span></div>`).join('');
  document.getElementById('fAmt').value='';
  document.getElementById('fDesc').value='';
  const n=new Date();
  document.getElementById('fDate').value=`${n.getFullYear()}-${P(n.getMonth()+1)}-${P(n.getDate())}`;
  document.getElementById('ovAdd').classList.add('on');
  setTimeout(()=>document.getElementById('fAmt').focus(),320);
}
function pk(e){sel=decodeURIComponent(e.dataset.c);
  document.querySelectorAll('.cb').forEach(b=>b.classList.toggle('sel',b===e));}

async function submitExp(){
  const a=parseFloat(document.getElementById('fAmt').value);
  const d=document.getElementById('fDesc').value.trim();
  const dt=document.getElementById('fDate').value;
  if(!sel){tst('請選擇類別');return;}
  if(!a||a<=0){tst('請輸入金額');return;}
  if(!dt){tst('請選擇日期');return;}
  const[y,mo,dy]=dt.split('-');
  const b=document.getElementById('fBtn');b.disabled=true;b.textContent='儲存中…';
  try{
    const j=await api({action:'addExpense',date:`${mo}/${dy}`,cat:sel,desc:d,amt:a,card:'現金',year:y});
    D.expenses=j.expenses;saveCache();cm=parseInt(mo,10);rAll();cl('ovAdd');tst(`已記錄 ${F(a)}`);
  }catch(e){tst(e.message);}
  b.disabled=false;b.textContent='確認記錄';
}

function rTips(){
  const el=document.getElementById('tips');
  const md=D.expenses[cm]||{};
  const cats=Object.entries(md).sort((a,b)=>b[1].total-a[1].total);
  const tot=cats.reduce((s,[,v])=>s+v.total,0);
  if(!tot){el.innerHTML='';return;}

  const tb=Object.values(D.budgets).reduce((a,b)=>a+b,0);
  const inc=D.income.months[cm]||0;

  // 找超支的類別
  const over=cats.filter(([c,v])=>D.budgets[c]&&v.total>D.budgets[c])
    .map(([c,v])=>({c,over:v.total-D.budgets[c],used:v.total,bg:D.budgets[c]}))
    .sort((a,b)=>b.over-a.over);

  // 找最大筆的單次支出
  const allItems=[];
  Object.keys(md).forEach(c=>md[c].items.forEach(i=>allItems.push({cat:c,...i})));
  allItems.sort((a,b)=>b.amt-a.amt);
  const big=allItems.slice(0,3);

  // 前3大類別
  const top3=cats.slice(0,3);

  // 跟上個月比
  const pm=D.expenses[cm-1]||{};
  const pmTot=Object.values(pm).reduce((s,c)=>s+c.total,0);
  const mom=pmTot?tot-pmTot:0;

  let msg='',items=[];

  if(over.length){
    const o=over[0];
    msg=`這個月「${o.c.slice(2).trim()}」花超過了`;
    items.push(`<b>${o.c.slice(2).trim()}</b>：預算 ${F2(o.bg)}，實際花了 ${F2(o.used)}，超出 <b>${F2(o.over)}</b>`);
    if(over.length>1)
      items.push(`另外還有 ${over.slice(1).map(x=>x.c.slice(2).trim()).join('、')} 也超支了`);
  }else{
    msg='這個月預算控制得不錯';
    items.push(`總共花了 <b>${F2(tot)}</b>，預算 ${F2(tb)}，還剩 <b>${F2(tb-tot)}</b>`);
  }

  if(big.length&&big[0].amt>=3000)
    items.push(`最大筆支出是 <b>${F2(big[0].amt)}</b>（${E(big[0].desc||big[0].cat.slice(2).trim())}），佔了整月的 ${(big[0].amt/tot*100).toFixed(0)}%`);

  if(mom>0&&pmTot)
    items.push(`比上個月多花了 <b>${F2(mom)}</b>（上月 ${F2(pmTot)}）`);
  else if(mom<0&&pmTot)
    items.push(`比上個月省下 <b>${F2(-mom)}</b>，繼續保持`);

  if(top3.length>=3){
    const t3=top3.reduce((s,[,v])=>s+v.total,0);
    items.push(`${top3.map(([c])=>c.slice(2).trim()).join('、')} 這三項就佔了 <b>${(t3/tot*100).toFixed(0)}%</b>，是最值得省的地方`);
  }

  // 下月目標
  let goal='';
  if(over.length){
    const cut=over.reduce((s,o)=>s+o.over,0);
    goal=`下個月如果把超支的部分省下來，可以多存 <b>${F2(cut)}</b>`;
  }else if(inc){
    goal=`這個月收入 ${F2(inc)}、支出 ${F2(tot)}，實際存下 <b>${F2(inc-tot)}</b>`;
  }

  el.innerHTML=`<div class="tip">
    <div class="tip-h">${cm}月 消費體檢</div>
    <div class="tip-m">${msg}</div>
    <ul class="tip-l">${items.map(i=>`<li>${i}</li>`).join('')}</ul>
    ${goal?`<div class="tip-goal">💡 ${goal}</div>`:''}
  </div>`;
}

function draw(){
  rTips();
  const md=D.expenses[cm]||{};
  const cs=Object.entries(md).sort((a,b)=>b[1].total-a[1].total);
  const tt=cs.reduce((s,[,v])=>s+v.total,0);
  if(c1){c1.destroy();c1=null;}
  if(tt)c1=new Chart(document.getElementById('c1'),{type:'doughnut',
    data:{labels:cs.map(([c])=>c.slice(2).trim()),datasets:[{data:cs.map(([,v])=>v.total),
      backgroundColor:cs.map(([c])=>CL[c]||'#8A9BAF'),borderColor:'#fff',borderWidth:2,hoverOffset:8}]},
    options:{responsive:1,maintainAspectRatio:0,cutout:'62%',
      plugins:{legend:{position:'bottom',labels:{boxWidth:8,boxHeight:8,font:{size:10,family:'Noto Sans TC'},padding:9,color:'#42566E'}},
        tooltip:{callbacks:{label:c=>` ${F(c.raw)}（${(c.raw/tt*100).toFixed(1)}%）`}}},
      onClick:(e,i)=>{if(i.length)go('detail');}}});

  const iA=[],eA=[];
  for(let m=1;m<=12;m++){iA.push(D.income.months[m]||0);
    eA.push(Object.values(D.expenses[m]||{}).reduce((s,c)=>s+c.total,0));}
  if(c2){c2.destroy();c2=null;}
  c2=new Chart(document.getElementById('c2'),{type:'bar',
    data:{labels:MN,datasets:[{label:'收入',data:iA,backgroundColor:'#0E7C7B',borderRadius:3,barPercentage:.7},
      {label:'支出',data:eA,backgroundColor:'#B33A3A',borderRadius:3,barPercentage:.7}]},
    options:{responsive:1,maintainAspectRatio:0,
      plugins:{legend:{position:'bottom',labels:{boxWidth:8,boxHeight:8,font:{size:10,family:'Noto Sans TC'},padding:9,color:'#42566E'}},
        tooltip:{callbacks:{label:c=>` ${c.dataset.label} ${F(c.raw)}`}}},
      scales:{y:{grid:{color:'#EDF1F6'},ticks:{font:{size:9},color:'#8A9BAF',callback:v=>(v/1000)+'k'}},
        x:{grid:{display:0},ticks:{font:{size:9},color:'#8A9BAF'}}}}});

  const aA=[];for(let m=1;m<=12;m++)aA.push(D.assets.totals[m]||null);
  if(c3){c3.destroy();c3=null;}
  c3=new Chart(document.getElementById('c3'),{type:'line',
    data:{labels:MN,datasets:[{data:aA,borderColor:'#1C3350',backgroundColor:'rgba(28,51,80,.07)',
      fill:1,tension:.32,spanGaps:1,pointRadius:3,pointBackgroundColor:'#C9A227',borderWidth:2}]},
    options:{responsive:1,maintainAspectRatio:0,
      plugins:{legend:{display:0},tooltip:{callbacks:{label:c=>' '+F(c.raw)}}},
      scales:{y:{grid:{color:'#EDF1F6'},ticks:{font:{size:9},color:'#8A9BAF',callback:v=>(v/10000).toFixed(0)+'萬'}},
        x:{grid:{display:0},ticks:{font:{size:9},color:'#8A9BAF'}}}}});
}

function cl(i){document.getElementById(i).classList.remove('on');}
let _t;
function tst(m,d=2400){const t=document.getElementById('toast');
  t.textContent=m;t.classList.add('on');clearTimeout(_t);_t=setTimeout(()=>t.classList.remove('on'),d);}
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&document.getElementById('ovAdd').classList.contains('on'))submitExp();});

loadAll();
</script>
